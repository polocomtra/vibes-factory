[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesfactory-api"
version = "0.1.0"
description = "VibesFactory production-inspired Agentic AI Platform API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "cryptography>=43,<46",
  "exa-py>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=2.24,<3.0",
  "google-cloud-storage>=3,<4",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "mcp>=2,<3",
  "openai>=1.0,<2.0",
  "pgvector>=0.4,<1.0",
  "pypdf>=6,<7",
  "regex>=2024.11.6,<2027.0",
  "python-multipart>=0.0.9,<1.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=24.4,<26.0",
  "tokenizers>=0.21,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "types-jsonschema>=4.23,<5.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["apps*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["../.."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "../../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
