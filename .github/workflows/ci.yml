name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vibesfactory_test
          POSTGRES_USER: vibesfactory
          POSTGRES_PASSWORD: vibesfactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibesfactory -d vibesfactory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: python -m pip install -e "./apps/api[dev]"
      - name: Lint
        run: ruff check apps/api tests
      - name: Type check
        run: mypy apps/api/app
      - name: Migrate
        env:
          VF_DATABASE_URL: postgresql+asyncpg://vibesfactory:vibesfactory@localhost:5432/vibesfactory_test
        run: alembic upgrade head
      - name: Test
        env:
          VF_DATABASE_URL: postgresql+asyncpg://vibesfactory:vibesfactory@localhost:5432/vibesfactory_test
          VF_TEST_DATABASE_URL: postgresql+asyncpg://vibesfactory:vibesfactory@localhost:5432/vibesfactory_test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        working-directory: apps/web
        run: npm install
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
